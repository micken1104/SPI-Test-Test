function arrange(items){
 for(let t=0;t<3000;t++){
  const rest=sh(items.slice()),res=[],cnt=Array(TR.length).fill(0);
  rest.forEach(q=>q.ts.forEach(x=>cnt[x]++));
  while(rest.length){
   const last=res[res.length-1];let best=-1,bs=-1;
   rest.forEach((q,i)=>{if(last&&share(last,q))return;const s=q.ts.reduce((p,x)=>p+cnt[x],0)+Math.random();if(s>bs){bs=s;best=i}});
   if(best<0)break;
   const q=rest.splice(best,1)[0];q.ts.forEach(x=>cnt[x]--);res.push(q);
  }
  if(!rest.length)return res;
 }
 return sh(items);
}

}

function eigN(A){
 const m=A.length;let w=Array(m).fill(1/m);
 for(let t=0;t<200;t++){const x=A.map(r=>r.reduce((s,a,j)=>s+a*w[j],0));const s=x.reduce((a,b)=>a+b);w=x.map(v=>v/s)}
 const Aw=A.map(r=>r.reduce((s,a,j)=>s+a*w[j],0)),lam=Aw.reduce((s,v,i)=>s+v/w[i],0)/m;
 const CI=m>2?(lam-m)/(m-1):0,RI=RIT[m]||0;
 return{w,lam,CI,RI,CR:RI?CI/RI:0};
}
const gmM=ms=>ms[0].map((row,i)=>row.map((_,j)=>Math.pow(ms.reduce((p,m)=>p*m[i][j],1),1/ms.length)));
function build(r){
 const Wm=SIDES.map(s=>ones(s.t.length)),xs={};
 Q.forEach((q,i)=>{
  if(q.type!=="ab"||q.round!==r)return;
  const v=val(ans[i]),L=TR[q.l],R=TR[q.r];
  if(q.kind=="in"){Wm[L.si][L.li][R.li]=v;Wm[L.si][R.li][L.li]=1/v}
  else{const a=L.si,b=R.si,k=Math.min(a,b)+"-"+Math.max(a,b);(xs[k]=xs[k]||[]).push(Math.log(a<b?v:1/v))}
 });
 const X=ones(4);
 for(const k in xs){const [a,b]=k.split("-").map(Number),g=Math.exp(xs[k].reduce((p,c)=>p+c,0)/xs[k].length);X[a][b]=g;X[b][a]=1/g}
 return{Wm,X};
}
function hier(Wm,X){

 SIDES.forEach((s,si)=>{C+=se.w[si]*loc[si].CI;R+=se.w[si]*loc[si].RI;s.t.forEach((_,li)=>gw.push(se.w[si]*loc[si].w[li]))});
 return{se,loc,gw,H:R?C/R:0};
}
function cycles(A,names){
 const m=A.length,b=(i,j)=>A[i][j]>1+1e-9,c=[];
 for(let i=0;i<m;i++)for(let j=i+1;j<m;j++)for(let k=j+1;k<m;k++)
  if((b(i,j)&&b(j,k)&&b(k,i))||(b(j,i)&&b(k,j)&&b(i,k)))c.push([names[i],names[j],names[k]].join(" / "));
 return c;
}
const pos=v=>{let k=V.findIndex(x=>Math.abs(x-v)<1e-9);return k>=0?k:V.length-1-V.findIndex(x=>Math.abs(x-1/v)<1e-9)};

 for(let i=0;i<s.length;){let j=i;while(j+1<s.length&&s[j+1][0]==s[i][0])j++;const av=(i+j)/2+1;for(let k=i;k<=j;k++)r[s[k][1]]=av;i=j+1}return r};
const pearson=(x,y)=>{const n=x.length,mx=x.reduce((a,b)=>a+b)/n,my=y.reduce((a,b)=>a+b)/n;let sxy=0,sx=0,sy=0;
 for(let i=0;i<n;i++){sxy+=(x[i]-mx)*(y[i]-my);sx+=(x[i]-mx)**2;sy+=(y[i]-my)**2}return sx&&sy?sxy/Math.sqrt(sx*sy):0};

 <li><code>a<sub>ij</sub> &gt; 1</code>：<i>i</i> の方が <i>j</i> より自分に近い（「Aに近い」で5、「どちらかといえばA」で2。6択のときは5、3、2）。複数の問いや2周分の平均なので、中間値も出ます。</li>
