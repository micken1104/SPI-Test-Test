name: Deploy to AWS S3 & CloudFront

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync Files to S3
        run: |
          aws s3 sync . s3://amzn-s3-spi-test-test --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md"

      - name: Invalidate CloudFront Cache
        run: |
          distribution_id="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          distribution_id="$(echo "${distribution_id}" | tr -d '[:space:]')"
          distribution_id="${distribution_id%/}"
          distribution_id="${distribution_id##*/}"
          distribution_id="${distribution_id%%[\?#]*}"

          if [ -z "${distribution_id}" ]; then
            echo "CLOUDFRONT_DISTRIBUTION_ID secret is empty or invalid."
            exit 1
          fi

          if [[ "${distribution_id}" == *.* ]]; then
            resolved_distribution_id="$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?DomainName=='${distribution_id}'].Id | [0]" \
              --output text)"

            if [ "${resolved_distribution_id}" != "None" ] && [ -n "${resolved_distribution_id}" ]; then
              distribution_id="${resolved_distribution_id}"
            fi
          fi

          if ! [[ "${distribution_id}" =~ ^[A-Z0-9]+$ ]]; then
            echo "CLOUDFRONT_DISTRIBUTION_ID must resolve to a valid CloudFront distribution ID."
            exit 1
          fi

          aws cloudfront create-invalidation \
            --distribution-id "${distribution_id}" \
            --paths "/*"